<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-label="Protiti Sahajee Prachi: CSE Student, Aspiring QA Engineer, Researcher">
  <title>Protiti Sahajee Prachi: CSE Student, Aspiring QA Engineer, Researcher</title>
  <defs>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#d9ff4f"/>
      <stop offset="0.5" stop-color="#9cc8ff"/>
      <stop offset="1" stop-color="#b9a6ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#d9ff4f" stop-opacity="0.18"/><stop offset="1" stop-color="#d9ff4f" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#b9a6ff" stop-opacity="0.2"/><stop offset="1" stop-color="#b9a6ff" stop-opacity="0"/></radialGradient>
    <!-- One clip per role: its width grows to "type" the word, then shrinks to erase it. 9 s cycle, 3 s per role. -->
    <clipPath id="r0"><rect x="76" y="146" height="34" width="0">
      <animate attributeName="width" dur="9s" repeatCount="indefinite" keyTimes="0;0.111;0.267;0.311;1" values="0;143;143;0;0"/>
    </rect></clipPath>
    <clipPath id="r1"><rect x="76" y="146" height="34" width="0">
      <animate attributeName="width" dur="9s" repeatCount="indefinite" keyTimes="0;0.333;0.444;0.6;0.644;1" values="0;0;260;260;0;0"/>
    </rect></clipPath>
    <clipPath id="r2"><rect x="76" y="146" height="34" width="0">
      <animate attributeName="width" dur="9s" repeatCount="indefinite" keyTimes="0;0.667;0.778;0.933;0.978;1" values="0;0;130;130;0;0"/>
    </rect></clipPath>
  </defs>

  <rect width="960" height="270" rx="18" fill="#08090d"/>
  <circle cx="160" cy="60" r="170" fill="url(#glowA)">
    <animate attributeName="cx" values="160;260;160" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="220" r="190" fill="url(#glowB)">
    <animate attributeName="cy" values="220;150;220" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- left: name and typed roles -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="48" y="62" font-family="Consolas, Menlo, monospace" font-size="15" fill="#d9ff4f">&gt; hello, world</text>
    <text x="48" y="112" font-size="40" font-weight="800" fill="#f3f1ea">Protiti Sahajee Prachi
      <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
    </text>
    <rect x="48" y="126" height="4" rx="2" width="0" fill="url(#bar)">
      <animate attributeName="width" values="0;440" dur="1.2s" begin="0.3s" fill="freeze"/>
    </rect>
  </g>

  <g font-family="Consolas, Menlo, monospace" font-size="22">
    <text x="48" y="171" fill="#a1a2ad">$</text>
    <text x="76" y="171" fill="#9cc8ff" textLength="143" lengthAdjust="spacingAndGlyphs" clip-path="url(#r0)">CSE Student</text>
    <text x="76" y="171" fill="#d9ff4f" textLength="260" lengthAdjust="spacingAndGlyphs" clip-path="url(#r1)">Aspiring QA Engineer</text>
    <text x="76" y="171" fill="#b9a6ff" textLength="130" lengthAdjust="spacingAndGlyphs" clip-path="url(#r2)">Researcher</text>
    <rect y="152" width="11" height="24" fill="#f3f1ea" x="78">
      <animate attributeName="x" dur="9s" repeatCount="indefinite"
        keyTimes="0;0.111;0.267;0.311;0.333;0.444;0.6;0.644;0.667;0.778;0.933;0.978;1"
        values="78;223;223;78;78;340;340;78;78;210;210;78;78"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="48" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-style="italic" fill="#a1a2ad">I break software on purpose, so your users never do it by accident.</text>

  <!-- right: a tiny test run that passes, on a loop -->
  <g transform="translate(628 40)" font-family="Consolas, Menlo, monospace" font-size="14">
    <rect width="290" height="170" rx="12" fill="#0d0f15" stroke="rgba(243,241,234,0.12)"/>
    <circle cx="20" cy="20" r="5" fill="#ff6a4d"/>
    <circle cx="38" cy="20" r="5" fill="#f5c542"/>
    <circle cx="56" cy="20" r="5" fill="#4ade80"/>
    <text x="78" y="25" font-size="12" fill="#a1a2ad">selenium · portfolio.spec</text>
    <g fill="#f3f1ea">
      <text x="20" y="58" opacity="0"><tspan fill="#4ade80">✓</tspan> loads the profile
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.06;0.08;0.94;0.97;1" values="0;0;1;1;0;0"/></text>
      <text x="20" y="82" opacity="0"><tspan fill="#4ade80">✓</tspan> finds every bug
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.16;0.18;0.94;0.97;1" values="0;0;1;1;0;0"/></text>
      <text x="20" y="106" opacity="0"><tspan fill="#4ade80">✓</tspan> questions each result
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.26;0.28;0.94;0.97;1" values="0;0;1;1;0;0"/></text>
      <text x="20" y="130" opacity="0"><tspan fill="#4ade80">✓</tspan> ships reliable software
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.36;0.38;0.94;0.97;1" values="0;0;1;1;0;0"/></text>
    </g>
    <text x="20" y="156" font-size="13" opacity="0" fill="#d9ff4f">4 passed · 0 failed
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.46;0.48;0.94;0.97;1" values="0;0;1;1;0;0"/></text>
  </g>
</svg>
